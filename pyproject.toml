[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwp"
version = "0.1.0"
description = "Ablation study of the WGAN-gp Transformer for cloud workload prediction"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "pandas", "scipy", "pyyaml", "madgrad"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
