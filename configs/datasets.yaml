# Datasets the code knows about. `intervals` are the aggregation intervals in minutes
# (the ones the paper reports for that dataset).

google:
  title: Google Cluster 2011 (job SUBMIT events)
  intervals: [10, 30]
  license: CC BY
  source: https://github.com/google/cluster-data/blob/master/ClusterData2011_2.md
  pattern: spiky

azure_functions:
  title: Azure Functions 2019 (total invocations)
  intervals: [5, 10]
  license: CC BY
  source: https://github.com/Azure/AzurePublicDataset/blob/master/AzureFunctionsDataset2019.md
  pattern: seasonal

azure_vm_2017:
  title: Azure VM 2017 (VMs created)
  intervals: [10, 30, 60]
  license: CC BY 4.0
  source: https://github.com/Azure/AzurePublicDataset/blob/master/AzurePublicDatasetV1.md
  pattern: spiky

wikipedia:
  title: English Wikipedia page views 2019 (hourly, human traffic)
  intervals: [60]
  license: CC0
  source: https://wikimedia.org/api/rest_v1/ (pageviews/aggregate); not the paper's WikiBench trace
  pattern: seasonal

# Generated series for tests and timing only. Never report results on these.
synthetic_seasonal:
  title: Synthetic daily cycle (tests only)
  intervals: [10]
  synthetic: true
  pattern: seasonal

synthetic_spiky:
  title: Synthetic bursts (tests only)
  intervals: [10]
  synthetic: true
  pattern: spiky
