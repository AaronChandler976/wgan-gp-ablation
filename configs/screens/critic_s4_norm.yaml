experiment: critic_s4_norm
description: 'Stage 4 of the critic screen: spectral normalization and layer normalization in the critic,
  on the setting carried forward from stage 3 (adversarial weight 0.01, the reported critic settings,
  since no stage-3 combination beat it). Compare with `w0.01` of critic_s1_weight.'
seeds:
- 0
- 100
fixed:
  train.patience: 150
reference: w0.01_spectral
cells:
- dataset: google
  interval: 10
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: google
  interval: 10
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
  interval: 5
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
  interval: 5
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
variants:
  w0.01_spectral:
    train.adv_weight: 0.01
    model.critic.norm: spectral
  w0.01_layer:
    train.adv_weight: 0.01
    model.critic.norm: layer
