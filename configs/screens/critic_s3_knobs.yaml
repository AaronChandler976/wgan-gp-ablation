experiment: critic_s3_knobs
description: 'Stage 3 of the critic screen: the critic''s own settings at adversarial weight 0.01. 16
  of the 24 combinations of critic updates per step {1, 5}, gradient penalty weight {1, 10}, critic width
  {32, 128} and critic learning-rate scale {0.25, 1, 4}, drawn with random.Random(0).sample. Compare with
  `w0.01` of critic_s1_weight.'
