- 0
- 100
fixed:
  train.patience: 150
reference: n1_gp1_h32_lr1
cells:
- dataset: google
  interval: 10
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: google
  interval: 10
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
