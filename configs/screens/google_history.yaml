experiment: google_history
description: 'History length on the two Google series, outside the tuning grid (48, 96). 5 and 472 are
  the ends of the range LoadDynamics selected for Google (its Table IV); 144 and 288 are one and two days
  at 10 minutes. Only the history length changes: learning rate and model size stay at each cell''s tuned
  values. `tuned` is the cell''s own tuned history (48 or 96) and is the reference.'
seeds:
- 0
- 100
fixed:
  train.patience: 150
reference: tuned
cells:
- dataset: google
  interval: 10
  arch: lstm
  critic: none
  optimizer: adam
