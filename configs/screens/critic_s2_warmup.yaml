experiment: critic_s2_warmup
description: 'Stage 2 of the critic screen: the forecaster first trains on the L1 loss alone for 50 epochs,
  then the critic term is switched on, either at once or rising linearly over 100 epochs. At the stage-1
  weight carried forward (0.01) and at the reported weight (1). Compare with `w0.01` and `w1` of critic_s1_weight.'
seeds:
- 0
- 100
fixed:
  train.patience: 150
reference: w0.01_warm50
cells:
- dataset: google
  interval: 10
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: google
  interval: 10
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
  interval: 5
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
  interval: 5
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
variants:
  w0.01_warm50:
    train.adv_weight: 0.01
    train.adv_warmup: 50
  w0.01_warm50_ramp100:
    train.adv_weight: 0.01
    train.adv_warmup: 50
    train.adv_ramp: 100
  w1_warm50:
    train.adv_weight: 1.0
    train.adv_warmup: 50
  w1_warm50_ramp100:
    train.adv_weight: 1.0
    train.adv_warmup: 50
    train.adv_ramp: 100
