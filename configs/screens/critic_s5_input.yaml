experiment: critic_s5_input
description: 'Stage 5 of the critic screen: a critic that sees more. `conditional` reads the history and
  the forecast through separate layers; `diffs` scores first differences. Each at weight 0.01 and at the
  reported weight 1. Compare with `w0.01` and `w1` of critic_s1_weight.'
seeds:
- 0
- 100
fixed:
  train.patience: 150
reference: w0.01_conditional
cells:
- dataset: google
  interval: 10
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: google
  interval: 10
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
  interval: 5
  arch: transformer
  critic: wgan-gp
  optimizer: madgrad
- dataset: azure_functions
  interval: 5
  arch: lstm
  critic: wgan-gp
  optimizer: madgrad
variants:
  w0.01_conditional:
    train.adv_weight: 0.01
    model.critic.kind: conditional
  w0.01_diffs:
    train.adv_weight: 0.01
    model.critic.input: diffs
  w1_conditional:
    train.adv_weight: 1.0
    model.critic.kind: conditional
  w1_diffs:
    train.adv_weight: 1.0
    model.critic.input: diffs
